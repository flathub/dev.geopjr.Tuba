app-id: dev.geopjr.Tuba
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: dev.geopjr.Tuba
add-extensions:
  com.github.rafostar.Clapper.Enhancers:
    version: stable
    directory: extensions/clapper/enhancers
    add-ld-path: lib
    no-autodownload: false
    autodelete: false
finish-args:
  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --own-name=org.mpris.MediaPlayer2.Tuba.*
  - --env=CLAPPER_ENHANCERS_PATH=/app/extensions/clapper/enhancers/plugins
  - --env=PYTHONPATH=/app/extensions/clapper/enhancers/python/site-packages
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/gir-1.0
  - /share/man
  - /share/vala
cleanup-commands:
  - mkdir -p /app/extensions/clapper/enhancers
modules:
  - name: libpeas
    buildsystem: meson
    config-opts:
      - --wrap-mode=nodownload
      - -Dgjs=false
      - -Dlua51=false
      - -Dintrospection=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libpeas/2.2/libpeas-2.2.1.tar.xz
        sha256: 589eca89b437006edf3755478df037c740a2a84cfa5d202dbad6095e828e2488
        x-checker-data:
          type: gnome
          name: libpeas
  - name: clapper
    buildsystem: meson
    config-opts:
      - -Dclapper=enabled
      - -Dclapper-gtk=enabled
      - -Dclapper-app=disabled
      - -Dintrospection=enabled
      - -Dvapi=enabled
    sources:
      - type: git
        url: https://github.com/Rafostar/clapper.git
        tag: 0.10.0
        x-checker-data:
          type: git
          tag-pattern: ^([\d.]+)$
        commit: 8fcaaffe8a8f408f26a2da9f0a0087e32195fa46
  - name: libspelling
    buildsystem: meson
    config-opts:
      - -Ddocs=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libspelling/0.4/libspelling-0.4.10.tar.xz
        sha256: 56e3f01a3a18b575beea4c34349f99cdaba316e1f7c271b1231f7bcf5d9af73b
        x-checker-data:
          type: gnome
          name: libspelling
  - name: exiv2
    sources:
      - type: archive
        url: https://github.com/Exiv2/exiv2/archive/refs/tags/v0.28.8.tar.gz
        sha256: ea51b0609f58a9afa063b60daa1539948b62247721e154f4fff0ad3aec9f9756
        x-checker-data:
          type: anitya
          project-id: 769
          stable-only: true
          url-template: https://github.com/Exiv2/exiv2/archive/refs/tags/v$version.tar.gz
    cleanup:
      - /bin
    buildsystem: cmake-ninja
    config-opts:
      - -DEXIV2_BUILD_EXIV2_COMMAND=OFF
      - -DEXIV2_ENABLE_INIH=OFF
      - -DEXIV2_ENABLE_VIDEO=OFF
      - -DEXIV2_BUILD_SAMPLES=OFF
      - -DEXIV2_BUILD_UNIT_TESTS=OFF
      - -DEXIV2_BUILD_DOC=OFF
      - -DEXIV2_ENABLE_LENSDATA=OFF
      - -DEXIV2_ENABLE_XMP=ON
      - -DEXIV2_ENABLE_EXTERNAL_XMP=OFF
      - -DCMAKE_BUILD_TYPE=MinSizeRel
  - name: gexiv2
    buildsystem: meson
    config-opts:
      - -Dpython3=false
      - -Dtools=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/gexiv2/0.16/gexiv2-0.16.1.tar.xz
        sha256: 18e9a05c637a77e800b001d87f70e4d02a7ba41b7745400a314a1072a1ddc943
        x-checker-data:
          type: gnome
          name: gexiv2
  - name: tuba
    buildsystem: meson
    config-opts:
      - -Dclapper=enabled
      - -Dspelling=enabled
      - -Dgstreamer=enabled
      - -Din-app-browser=enabled
      - -Dgexiv2=enabled
    sources:
      - type: git
        url: https://github.com/GeopJr/Tuba.git
        tag: v0.10.3
        commit: a508a96a226c65f0e175db043c9ddbc284e6002f
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
      - type: patch
        path: feat-metainfo-lock-screenshots.patch # https://github.com/GeopJr/Tuba/pull/1578
