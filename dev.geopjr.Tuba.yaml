app-id: dev.geopjr.Tuba
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: dev.geopjr.Tuba
add-extensions:
  com.github.rafostar.Clapper.Enhancers:
    version: stable
    directory: extensions/clapper/enhancers
    add-ld-path: lib
    no-autodownload: false
    autodelete: false
finish-args:
  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --talk-name=org.unifiedpush.Distributor.*
  - --own-name=org.mpris.MediaPlayer2.Tuba.*
  - --env=CLAPPER_ENHANCERS_PATH=/app/extensions/clapper/enhancers/plugins
  - --env=PYTHONPATH=/app/extensions/clapper/enhancers/python/site-packages
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/gir-1.0
  - /share/man
  - /share/vala
cleanup-commands:
  - mkdir -p /app/extensions/clapper/enhancers
modules:
  - name: libunifiedpush
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/libunifiedpush/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - sed -i 's/\bcargo build\b/cargo build --offline/' ./libunifiedpush/Makefile
      - cd libunifiedpush && make typelib
      - >-
        printf '%s\n' 'prefix=/app' 'exec_prefix=${prefix}'
        'libdir=${exec_prefix}/lib' 'includedir=${prefix}/include'
        'datarootdir=${prefix}/share' 'datadir=${datarootdir}' '' 'Name:
        unifiedpush' 'Description:' 'Version: 0.1' 'Requires: glib-2.0
        gobject-2.0' 'Libs: -L${libdir} -lunifiedpush' 'Cflags:
        -I${includedir}/libunifiedpush' > unifiedpush.pc
      - install -Dm0755 ./target/debug/libunifiedpush.so ${FLATPAK_DEST}/lib/libunifiedpush.so
      - install -Dm0755 ./target/debug/libunifiedpush.so ${FLATPAK_DEST}/lib/libunifiedpush.so.0
      - install -Dm0644 ./libunifiedpush/out/UnifiedPush-0.1.gir ${FLATPAK_DEST}/share/gir-1.0/out/UnifiedPush-0.1.gir
      - install -Dm0644 ./unifiedpush.pc ${FLATPAK_DEST}/lib/pkgconfig/unifiedpush.pc
      - install -Dm0644 ./libunifiedpush/include/unifiedpush.h ${FLATPAK_DEST}/include/libunifiedpush/unifiedpush.h
    sources:
      - type: git
        url: 'https://codeberg.org/UnifiedPush/unifiedpush-rs'
        commit: 77a97643e5ec185e4f4ec90265e845b2f39c05c0
      - cargo-sources.json
  - name: libpeas
    buildsystem: meson
    config-opts:
      - --wrap-mode=nodownload
      - -Dgjs=false
      - -Dlua51=false
      - -Dintrospection=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libpeas/2.2/libpeas-2.2.1.tar.xz
        sha256: 589eca89b437006edf3755478df037c740a2a84cfa5d202dbad6095e828e2488
        x-checker-data:
          type: gnome
          name: libpeas
  - name: clapper
    buildsystem: meson
    config-opts:
      - -Dclapper=enabled
      - -Dclapper-gtk=enabled
      - -Dclapper-app=disabled
      - -Dintrospection=enabled
      - -Dvapi=enabled
    sources:
      - type: git
        url: https://github.com/Rafostar/clapper.git
        tag: 0.10.0
        x-checker-data:
          type: git
          tag-pattern: ^([\d.]+)$
        commit: 8fcaaffe8a8f408f26a2da9f0a0087e32195fa46
  - name: libspelling
    buildsystem: meson
    config-opts:
      - -Ddocs=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libspelling/0.4/libspelling-0.4.10.tar.xz
        sha256: 56e3f01a3a18b575beea4c34349f99cdaba316e1f7c271b1231f7bcf5d9af73b
        x-checker-data:
          type: gnome
          name: libspelling
  - name: exiv2
    sources:
      - type: archive
        url: https://github.com/Exiv2/exiv2/archive/refs/tags/v0.28.7.tar.gz
        sha256: 5e292b02614dbc0cee40fe1116db2f42f63ef6b2ba430c77b614e17b8d61a638
        x-checker-data:
          type: anitya
          project-id: 769
          stable-only: true
          url-template: https://github.com/Exiv2/exiv2/archive/refs/tags/v$version.tar.gz
    cleanup:
      - /bin
    buildsystem: cmake-ninja
    config-opts:
      - -DEXIV2_BUILD_EXIV2_COMMAND=OFF
      - -DEXIV2_ENABLE_INIH=OFF
      - -DEXIV2_ENABLE_VIDEO=OFF
      - -DEXIV2_BUILD_SAMPLES=OFF
      - -DEXIV2_BUILD_UNIT_TESTS=OFF
      - -DEXIV2_BUILD_DOC=OFF
      - -DEXIV2_ENABLE_LENSDATA=OFF
      - -DEXIV2_ENABLE_XMP=ON
      - -DEXIV2_ENABLE_EXTERNAL_XMP=OFF
      - -DCMAKE_BUILD_TYPE=MinSizeRel
  - name: gexiv2
    buildsystem: meson
    config-opts:
      - -Dpython3=false
      - -Dtools=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/gexiv2/0.16/gexiv2-0.16.2.tar.xz
        sha256: aad9e240fdffbe85e390f46ee0a567e251baea5c29c3d8690260388683dc8d0a
        x-checker-data:
          type: gnome
          name: gexiv2
  - name: tuba
    buildsystem: meson
    config-opts:
      - -Dclapper=enabled
      - -Dspelling=enabled
      - -Dgstreamer=enabled
      - -Din-app-browser=enabled
      - -Dgexiv2=enabled
      - -Dunifiedpush=enabled
    sources:
      - type: git
        url: https://codeberg.org/GeopJr/Tuba.git
        tag: v0.11.0
        commit: 8fa489cad0be3e9129fba79901fb8dab18817f28
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
